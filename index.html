<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Atlantic Fireworks</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- 🔥 Header and Nav -->
  <header class="site-header">
    <h1 class="site-title">🔥 Atlantic Fireworks</h1>
    <nav class="site-nav">
      <a href="#">Home</a>
      <a href="#">Cart</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <!-- 🎇 Hero Banner -->
  <section class="hero">
    <h2>🎇 Welcome to Atlantic Fireworks 🎇</h2>
    <p>Explore our explosive selection and light up your next celebration!</p>
  </section>

  <!-- 💥 Inventory Grid -->
  <section class="inventory-section">
    <h2 class="section-title">💥 All Fireworks</h2>
    <div id="inventory" class="inventory-grid"></div>
  </section>

  <!-- 🛒 Cart Section -->
  <section class="cart-section">
    <h2>Your Cart</h2>
    <div id="cart-items">Cart is empty.</div>
    <button id="clear-cart">Clear Cart</button>
  </section>

  <!-- 🔍 Image Modal -->
  <div id="image-modal" class="modal">
    <span class="close-btn">&times;</span>
    <img class="modal-content" id="modal-image" />
  </div>

  <footer class="site-footer">
    <p>© 2025 Atlantic Fireworks. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
