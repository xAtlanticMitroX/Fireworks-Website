<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Punjabi Pyro Fireworks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="site-left">
      <a href="index.html" class="site-title">Punjabi Pyro Fireworks</a>
    </div>
    <div class="site-right">
      <span id="total-price">$0.00</span>
      <a href="cart.html" id="cart-icon" data-count="0">🛒</a>
      <button id="toggle-theme">☀️ / 🌙</button>
    </div>
  </header>

  <section class="hero-banner">
    <h1>Punjabi Pyro Fireworks</h1>
    <p>Sparkle up your night with cool fireworks!</p>
  </section>

  <div id="search-bar">
    <input type="text" id="search-input" placeholder="Search fireworks...">
  </div>


  <div id="category-filter">
    <button data-category="all">All</button>
    <button data-category="Cake">Cakes</button>
    <button data-category="Big Boar">Big Boar</button>
    <button data-category="Finale">Finale</button>
    <button data-category="Shells">Shells</button>
  </div>

  <main id="inventory"></main>

  <!-- Modal for expanded image -->
  <div id="image-modal" class="hidden">
    <span id="close-modal">&times;</span>
    <img id="modal-image" src="" alt="Expanded Firework">
  </div>

  <script src="script.js"></script>
</body>
</html>
