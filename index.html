<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atlantic Fireworks Store</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-left">
      <h1 class="site-title">🔥 Atlantic Fireworks</h1>
      <nav class="site-nav">
        <a href="index.html">Home</a>
      </nav>
    </div>
    <div class="header-right">
      <a href="cart.html" class="cart-icon-link">
        🛒<span id="cart-count">0</span>
      </a>
      <span id="cart-total-price" class="cart-total-price">$0.00</span>
    </div>
    <div class="theme-toggle">
      <button id="toggle-theme">☀️ / 🌙</button>
    </div>

  </header>

  <section class="hero-banner">
    <h1>Atlantic Fireworks</h1>
    <p>Sparkle up your night with amazing fireworks!</p>
  </section>


  <main class="inventory-container" id="inventory">
    <!-- Products loaded here by script.js -->
  </main>

  <!-- Modal for Image Preview -->
  <div id="image-modal" class="modal">
    <span id="close-modal" class="close">&times;</span>
    <img class="modal-content" id="modal-img" />
    <div id="caption"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
