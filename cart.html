<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Cart - Atlantic Fireworks</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">🛒 Your Cart</h1>
    <nav class="site-nav">
      <a href="index.html">← Back to Shop</a>
    </nav>
  </header>

    <section class="cart-section">
    <div id="cart-items">Loading cart...</div>
    <button id="clear-cart">Clear Cart</button>
    <button id="checkout-btn" style="margin-left: 1em;">Checkout</button>  <!-- NEW -->
    </section>


  <script>
    const cartItemsDiv = document.getElementById("cart-items");

    function loadCart() {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      if (cart.length === 0) {
        cartItemsDiv.textContent = "Your cart is empty.";
        return;
      }

      cartItemsDiv.innerHTML = '';
      cart.forEach(item => {
        const div = document.createElement('div');
        div.classList.add('cart-item');
        div.innerHTML = `
          <span>${item.name} x${item.qty}</span>
          <span>$${(item.price * item.qty).toFixed(2)}</span>
        `;
        cartItemsDiv.appendChild(div);
      });
    }

    document.getElementById('clear-cart').addEventListener('click', () => {
      localStorage.removeItem('cart');
      loadCart();
    });

    loadCart();

    document.getElementById('checkout-btn').addEventListener('click', () => {
    // If cart is empty, alert user, else go to checkout.html
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    if (cart.length === 0) {
        alert('Your cart is empty! Add some fireworks before checkout.');
    } else {
        window.location.href = 'checkout.html';
    }
    });

  </script>
</body>
</html>
