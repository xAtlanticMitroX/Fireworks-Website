<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout - Atlantic Fireworks</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-left">
      <h1 class="site-title">🛒 Checkout</h1>
      <nav class="site-nav">
        <a href="index.html">← Back to Shop</a>
      </nav>
    </div>
    <div class="header-right">
      <a href="cart.html" class="cart-icon-link">
        🛒<span id="cart-count">0</span>
      </a>
      <span id="cart-total-price" class="cart-total-price">$0.00</span>
    </div>
  </header>

  <main class="checkout-main" style="max-width: 800px; margin: 2em auto; background: #222; padding: 2em; border-radius: 10px; color: #f5f5f5;">
    <section class="checkout-summary">
      <h2>Order Summary</h2>
      <div id="order-items">Loading your cart...</div>
      <p><strong>Total: </strong><span id="order-total">$0.00</span></p>
    </section>

    <section class="checkout-form-section">
      <h2>Shipping & Contact Info</h2>
      <form id="checkout-form">
        <label>
          Full Name:<br />
          <input type="text" id="name" required />
        </label><br /><br />

        <label>
          Email:<br />
          <input type="email" id="email" required />
        </label><br /><br />

        <label>
          Phone Number:<br />
          <input type="tel" id="phone" />
        </label><br /><br />

        <label>
          Shipping Address:<br />
          <textarea id="address" rows="3" required></textarea>
        </label><br /><br />

        <button type="submit">Place Order</button>
      </form>
    </section>

    <section id="confirmation-message" style="display:none; margin-top:2em;">
      <h2>Thank you for your order!</h2>
      <p>We will process your fireworks and contact you shortly.</p>
      <button id="back-to-shop">Back to Shop</button>
    </section>
  </main>

  <script src="checkout.js"></script>
</body>
</html>
